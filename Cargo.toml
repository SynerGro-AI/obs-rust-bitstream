[package]
name = "obs-rust-bitstream"
version = "0.1.0"
edition = "2021"
description = "Public foundation for the OBS Studio rewrite in Rust. Perfect bitstream port with Position trait (wrap vs no-wrap is type-level)."
license = "GPL-2.0-or-later"
repository = "https://github.com/SynerGro-AI/obs-rust-bitstream"
readme = "README.md"
keywords = ["obs", "bitstream", "rust", "obs-studio", "ffi", "rewrite"]
categories = ["multimedia", "encoding"]

[lib]
name = "obs_rust_bitstream"
path = "src/lib.rs"

[dependencies]

objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-av-foundation = { version = "0.3", optional = true, features = [
    "AVCaptureSession",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
] }
objc2-core-video = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true }
dispatch2 = { version = "0.2", optional = true }
libc = "0.2.191"
eframe = { version = "0.29", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
cpal = { version = "0.15", optional = true }
rusty_h264 = "0.14"
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"], optional = true }

[features]
default = []
ui = ["eframe", "image"]
avfoundation = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-av-foundation", "dep:objc2-core-video", "dep:objc2-core-media", "dep:dispatch2"]
audio = ["dep:cpal"]
windows = ["dep:windows"]


[[bin]]
name = "ui"
path = "src/bin/ui/main.rs"
required-features = ["ui"]

# Optimise dependencies (image decode, egui) even in debug builds so
# `cargo run --features ui --bin ui` stays responsive.
[profile.dev.package."*"]
opt-level = 2
